<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d">
  <title id="t">From commit to SageMaker training job: the CI/CD pipeline</title>
  <desc id="d">Five numbered steps, left to right, run by the CI/CD pipeline on the project branch. 1 Lint: run a code linter on the committed code. 2 Unit tests: run any code quality unit tests. 3 Build and test: build the image with the code, then test the entry point. 4 Push to ECR: push the containerized code to Amazon ECR. 5 Start training: call the SageMaker API directly, or your ML workflow orchestrator.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1a1a1a; }
      .h1 { font-size: 30px; font-weight: 700; }
      .sub { font-size: 17px; fill: #4a4a4a; }
      .grp { font-size: 16px; font-weight: 600; fill: #1a5490; }
      .num { font-size: 22px; font-weight: 700; fill: #ffffff; }
      .ct { font-size: 20px; font-weight: 700; fill: #0f3d66; }
      .body { font-size: 16px; }
      .foot { font-size: 14px; fill: #6b6b6b; }
      .card { fill: #ffffff; stroke: #1a1a1a; stroke-width: 2; }
      .band { fill: #f1f5f9; }
    </style>
  </defs>

  <rect width="1200" height="430" fill="#ffffff"/>

  <!-- Header -->
  <text class="h1" x="40" y="56">From commit to training job</text>
  <text class="sub" x="40" y="88">What the CI/CD pipeline does before SageMaker ever runs the code.</text>

  <!-- Group bracket -->
  <path d="M40 140 V128 H1160 V140" fill="none" stroke="#1a5490" stroke-width="2"/>
  <text class="grp" x="600" y="120" text-anchor="middle">CI/CD pipeline on the project branch</text>

  <!-- Progress line and numbers -->
  <line x1="144" y1="176" x2="1056" y2="176" stroke="#1a5490" stroke-width="3"/>
  <path d="M1038 166 L1056 176 L1038 186" fill="none" stroke="#1a5490" stroke-width="3"/>
  <g>
    <circle cx="144" cy="176" r="22" fill="#1a5490"/><text class="num" x="144" y="184" text-anchor="middle">1</text>
    <circle cx="372" cy="176" r="22" fill="#1a5490"/><text class="num" x="372" y="184" text-anchor="middle">2</text>
    <circle cx="600" cy="176" r="22" fill="#1a5490"/><text class="num" x="600" y="184" text-anchor="middle">3</text>
    <circle cx="828" cy="176" r="22" fill="#1a5490"/><text class="num" x="828" y="184" text-anchor="middle">4</text>
    <circle cx="1056" cy="176" r="22" fill="#0e8f99"/><text class="num" x="1056" y="184" text-anchor="middle">5</text>
  </g>

  <!-- Cards: 208 wide, 20 gap, starting x=40 -->
  <g transform="translate(40,214)">
    <rect class="card" width="208" height="160" rx="10"/>
    <path class="band" d="M2 10 A8 8 0 0 1 10 2 H198 A8 8 0 0 1 206 10 V52 H2 Z"/>
    <text class="ct" x="18" y="36">Lint</text>
    <text class="body" x="18" y="84">Run a code linter on</text>
    <text class="body" x="18" y="106">the committed code</text>
  </g>
  <g transform="translate(268,214)">
    <rect class="card" width="208" height="160" rx="10"/>
    <path class="band" d="M2 10 A8 8 0 0 1 10 2 H198 A8 8 0 0 1 206 10 V52 H2 Z"/>
    <text class="ct" x="18" y="36">Unit tests</text>
    <text class="body" x="18" y="84">Run any code quality</text>
    <text class="body" x="18" y="106">unit tests</text>
  </g>
  <g transform="translate(496,214)">
    <rect class="card" width="208" height="160" rx="10"/>
    <path class="band" d="M2 10 A8 8 0 0 1 10 2 H198 A8 8 0 0 1 206 10 V52 H2 Z"/>
    <text class="ct" x="18" y="36">Build and test</text>
    <text class="body" x="18" y="84">Build the image with</text>
    <text class="body" x="18" y="106">the code, then test</text>
    <text class="body" x="18" y="128">the entry point</text>
  </g>
  <g transform="translate(724,214)">
    <rect class="card" width="208" height="160" rx="10"/>
    <path class="band" d="M2 10 A8 8 0 0 1 10 2 H198 A8 8 0 0 1 206 10 V52 H2 Z"/>
    <text class="ct" x="18" y="36">Push to ECR</text>
    <text class="body" x="18" y="84">Push the containerized</text>
    <text class="body" x="18" y="106">code to Amazon ECR</text>
  </g>
  <g transform="translate(952,214)">
    <rect width="208" height="160" rx="10" fill="#e6f5f6" stroke="#0e8f99" stroke-width="2"/>
    <text class="ct" x="18" y="36">Start training</text>
    <text class="body" x="18" y="84">Call the SageMaker API</text>
    <text class="body" x="18" y="106">directly, or your ML</text>
    <text class="body" x="18" y="128">workflow orchestrator</text>
  </g>

  <!-- Footer -->
  <text class="foot" x="40" y="410">Securing Amazon SageMaker, Part 3: Training Jobs, Network Isolation, and Data Access</text>
  <text class="foot" x="1160" y="410" text-anchor="end">londonhouse.github.io</text>
</svg>
